<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetSluice is setting itself up</title>
<style>
  :root { --ground: #06141B; --panel: #0A222C; --text: #EAF6F7; --muted: #9DBFC6; --in: #4EA8FF; --ok: #5CE39A; --no: #FF9A8D; --gold: #F5C451; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--ground); color: var(--text); font: 17px/1.5 system-ui, sans-serif; }
  main { width: 100%; max-width: 560px; padding: 32px; border: 1px solid rgba(255, 255, 255, .1); border-radius: 26px; background: var(--panel); }
  h1 { margin: 0 0 8px; font-size: 30px; line-height: 1.15; letter-spacing: -.02em; }
  p { margin: 0 0 20px; color: var(--muted); }
  .bar { height: 12px; border-radius: 6px; overflow: hidden; background: rgba(255, 255, 255, .08); }
  .bar span { display: block; height: 100%; width: 4%; border-radius: 6px; background: linear-gradient(90deg, var(--in), var(--ok)); transition: width .6s ease-out; }
  .row { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-weight: 600; }
  .row span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #problem { margin: 20px 0 0; padding: 14px 16px; border-radius: 14px; background: rgba(255, 90, 90, .12); color: var(--no); font-weight: 600; }
  #problem[hidden] { display: none; }
  small { display: block; margin-top: 24px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>NetSluice is setting itself up</h1>
  <p>This happens once and takes a few minutes. The page moves on by itself; you do not need to do anything.</p>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="wrap"><span id="bar"></span></div>
  <div class="row"><span id="text">Starting</span><span id="count"></span></div>
  <div id="problem" role="status" hidden></div>
  <small>The green light on the device blinks during the setup and stays on when it is done. Please do not unplug it.</small>
</main>
<script>
  // The real interface replaces this page on the same address: once the status file is gone, reload.
  let gone = 0;
  async function tick() {
    try {
      const r = await fetch('status.json?' + Date.now(), { cache: 'no-store' });
      const type = r.headers.get('content-type') || '';
      if (!r.ok || !type.includes('json')) { if (++gone >= 2) location.replace('/'); return; }
      gone = 0;
      const s = await r.json();
      const pct = Math.max(4, Math.round((s.step - .5) / s.of * 100));
      document.getElementById('bar').style.width = pct + '%';
      document.getElementById('wrap').setAttribute('aria-valuenow', pct);
      document.getElementById('text').textContent = s.text;
      document.getElementById('count').textContent = 'step ' + s.step + ' of ' + s.of;
      const p = document.getElementById('problem'); p.hidden = !s.problem; p.textContent = s.problem || '';
    } catch { /* the web server is being swapped: keep asking */ }
  }
  tick(); setInterval(tick, 3000);
</script>
</body>
</html>
